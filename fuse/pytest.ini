[pytest]
testpaths =
    tests
    plugins/community/sst/tests
    plugins/community/gem5/tests

python_files = test_*.py
qt_api = pyside6

markers =
    sst: deterministic SST plugin tests
    sst_live: requires real SST Core/SST Elements and working sst-info/sst
    sst_external: deterministic external/custom SST component behavior using fixtures
    sst_ext: optional SST plugin backend external conformance/acceptance checks
    sst_remote: requires configured SSH/remote SST test environment
    qt: requires Qt/PySide6
    golden: semantic/golden export regression tests
    sst_15: requires SST 15.x
    sst_16: requires SST 16.x
    gem5: deterministic gem5 plugin tests
    gem5_live: requires real gem5 installation or gem5-capable container
    slow: slower integration tests

norecursedirs =
    .venv
    __pycache__
    .git
    app_data
