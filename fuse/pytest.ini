[pytest]
testpaths =
    fuse/tests
    fuse/plugins/community/sst/tests
    fuse/plugins/community/gem5/tests
python_files = test_*.py
qt_api = pyside6
markers =
    sst_live: requires real SST Core/SST Elements and working sst-info
    gem5_live: requires real gem5 installation or gem5-capable container
    slow: slower integration tests
norecursedirs =
    .venv
    __pycache__
    .git
    app_data