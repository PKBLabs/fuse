<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Group objects icon">
  <title>Group objects</title>
  <defs>
    <style>
      .line { stroke:#6f7780; stroke-width:4; fill:none; vector-effect:non-scaling-stroke; }
      .handle { fill:#8b939c; stroke:#6a727b; stroke-width:2; vector-effect:non-scaling-stroke; }
      .handle-inner { fill:#b8bec5; }
      .obj-a { fill:#eceff2; stroke:#7a848d; stroke-width:4; vector-effect:non-scaling-stroke; }
      .obj-b { fill:#dbdfe4; stroke:#868e97; stroke-width:4; vector-effect:non-scaling-stroke; }
    </style>
  </defs>

  <!-- outer selection bounds -->
  <rect x="20" y="20" width="216" height="216" class="line"/>

  <!-- corner handles -->
  <g>
    <rect x="6" y="6" width="28" height="28" class="handle"/>
    <rect x="11" y="11" width="18" height="18" class="handle-inner"/>

    <rect x="222" y="6" width="28" height="28" class="handle"/>
    <rect x="227" y="11" width="18" height="18" class="handle-inner"/>

    <rect x="6" y="222" width="28" height="28" class="handle"/>
    <rect x="11" y="227" width="18" height="18" class="handle-inner"/>

    <rect x="222" y="222" width="28" height="28" class="handle"/>
    <rect x="227" y="227" width="18" height="18" class="handle-inner"/>
  </g>

  <!-- grouped objects -->
  <rect x="115" y="117" width="76" height="76" class="obj-b"/>
  <rect x="64" y="55" width="76" height="84" class="obj-a"/>
</svg>
