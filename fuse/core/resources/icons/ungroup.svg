<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Ungroup objects icon">
  <title>Ungroup objects</title>
  <defs>
    <style>
      .line { stroke:#6f7780; stroke-width:4; fill:none; vector-effect:non-scaling-stroke; }
      .handle { fill:#8b939c; stroke:#6a727b; stroke-width:2; vector-effect:non-scaling-stroke; }
      .handle-inner { fill:#b8bec5; }
    </style>
  </defs>

  <!-- left large box -->
  <line x1="20" y1="20" x2="168" y2="20" class="line"/>
  <line x1="20" y1="20" x2="20" y2="160" class="line"/>
  <line x1="20" y1="160" x2="168" y2="160" class="line"/>
  <line x1="168" y1="20" x2="168" y2="160" class="line"/>

  <!-- lower box branching from left large box -->
  <line x1="96" y1="160" x2="96" y2="236" class="line"/>
  <line x1="96" y1="236" x2="236" y2="236" class="line"/>

  <!-- right box branching from large box -->
  <line x1="168" y1="96" x2="236" y2="96" class="line"/>
  <line x1="236" y1="96" x2="236" y2="236" class="line"/>

  <!-- handles -->
  <g>
    <rect x="6" y="6" width="28" height="28" class="handle"/>
    <rect x="11" y="11" width="18" height="18" class="handle-inner"/>

    <rect x="154" y="6" width="28" height="28" class="handle"/>
    <rect x="159" y="11" width="18" height="18" class="handle-inner"/>

    <rect x="6" y="146" width="28" height="28" class="handle"/>
    <rect x="11" y="151" width="18" height="18" class="handle-inner"/>

    <rect x="154" y="146" width="28" height="28" class="handle"/>
    <rect x="159" y="151" width="18" height="18" class="handle-inner"/>

    <rect x="82" y="222" width="28" height="28" class="handle"/>
    <rect x="87" y="227" width="18" height="18" class="handle-inner"/>

    <rect x="222" y="82" width="28" height="28" class="handle"/>
    <rect x="227" y="87" width="18" height="18" class="handle-inner"/>

    <rect x="222" y="222" width="28" height="28" class="handle"/>
    <rect x="227" y="227" width="18" height="18" class="handle-inner"/>
  </g>
</svg>
