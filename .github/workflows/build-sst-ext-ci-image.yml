name: Build SST External Validation CI Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag suffix, e.g. sst-15.1.2 or sst-16.0.0"
        required: true
        default: "sst-16.0.0"
      base_sst_image:
        description: "Existing SST CI base image that already contains SST-Core and SST-Elements"
        required: true
        default: "ghcr.io/pkblabs/fuse-sst-ci:sst-16.0.0"
      sst_ext_tests_ref:
        description: "sst-ext-tests git branch/tag/ref"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  build-sst-ext-image:
    name: Build and push SST external validation CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "SST_EXT_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fuse-sst-ext-ci" >> "$GITHUB_ENV"

      - name: Build SST external validation CI image
        run: |
          docker build \
            --build-arg BASE_IMAGE=${{ github.event.inputs.base_sst_image }} \
            --build-arg SST_EXT_TESTS_REF=${{ github.event.inputs.sst_ext_tests_ref }} \
            -f docker/sst-ext-ci/Dockerfile \
            -t "$SST_EXT_IMAGE:${{ github.event.inputs.image_tag }}" \
            .

      - name: Show built image size
        run: |
          docker image ls "$SST_EXT_IMAGE"

      - name: Push SST external validation CI image
        run: |
          docker push "$SST_EXT_IMAGE:${{ github.event.inputs.image_tag }}"
