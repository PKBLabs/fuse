name: Package

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "fuse/**"
      - "pyproject.toml"
      - "packaging/**"
      - ".github/workflows/package.yml"
  push:
    branches: [develop, main, stable-release-prep]
    paths:
      - "fuse/**"
      - "pyproject.toml"
      - "packaging/**"
      - ".github/workflows/package.yml"

jobs:
  pyinstaller:
    name: PyInstaller package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Build app
        run: pyinstaller --clean --noconfirm packaging/pyinstaller/fuse.spec

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: FUSE-${{ runner.os }}-${{ runner.arch }}
          path: dist/**
