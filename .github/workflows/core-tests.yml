name: Core Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core and dependency-light tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash
        working-directory: fuse

    env:
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            fuse/requirements.txt
            fuse/requirements-dev.txt

      - name: Install Qt runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show pytest configuration
        run: |
          python -m pytest --markers | grep -E "sst_live|gem5_live"
          python -m pytest --trace-config -q 2>&1 | grep -E "rootdir|configfile" || true

      - name: Run fast test suite
        run: |
          python -m pytest -q -m "not sst_live and not gem5_live"