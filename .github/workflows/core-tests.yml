name: Tier 1 / Core Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: read

jobs:
  core-tests:
    name: Tier 1 / core tests only
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            fuse/requirements.txt
            fuse/requirements-dev.txt

      - name: Install Qt runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fuse/requirements-dev.txt

      - name: Show pytest configuration
        run: |
          python -m pytest -c fuse/pytest.ini --markers | grep -E "sst_live|sst_remote|sst_external|sst_ext|gem5_live|slow"
          python -m pytest -c fuse/pytest.ini --trace-config -q fuse/tests 2>&1 | grep -E "rootdir|configfile" || true

      - name: Collect core tests only
        run: |
          python -m pytest --collect-only -q fuse/tests

      - name: Run core tests only
        run: |
          python -m pytest -q fuse/tests

      - name: Run core coverage
        run: |
          python -m pytest -q fuse/tests \
            --cov=fuse.core \
            --cov=fuse.app \
            --cov-report=term-missing \
            --cov-report=xml:coverage-core.xml

      - name: Upload core coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: coverage-core.xml
          if-no-files-found: error
