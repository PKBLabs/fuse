name: Tiered Core and Plugin Test Suite

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: read

jobs:
  core-tests:
    name: Tier 1 / Core tests only
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash
        working-directory: fuse

    env:
      PYTHONPATH: ${{ github.workspace }}/fuse
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            fuse/requirements.txt
            fuse/requirements-dev.txt

      - name: Install Qt runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show pytest configuration
        run: |
          python -m pytest --markers | grep -E "sst_live|sst_remote|sst_external|sst_ext|gem5_live|slow"
          python -m pytest --trace-config -q 2>&1 | grep -E "rootdir|configfile" || true

      - name: Collect core tests only
        run: |
          python -m pytest --collect-only -q tests

      - name: Run core tests only
        run: |
          python -m pytest -q tests

      - name: Run core coverage
        run: |
          python -m pytest -q tests \
            --cov=fuse.core \
            --cov=fuse.app \
            --cov-report=term-missing \
            --cov-report=xml:coverage-core.xml

      - name: Upload core coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: fuse/coverage-core.xml
          if-no-files-found: error

  plugin-deterministic-tests:
    name: Tier 2 / ${{ matrix.plugin.name }} deterministic plugin tests
    needs: core-tests
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        plugin:
          - name: SST
            path: plugins/community/sst/tests
            markers: not sst_live and not sst_remote and not sst_ext and not sst_external and not slow
          - name: gem5
            path: plugins/community/gem5/tests
            markers: not gem5_live and not slow

    defaults:
      run:
        shell: bash
        working-directory: fuse

    env:
      PYTHONPATH: ${{ github.workspace }}/fuse
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"
      FUSE_SST_VERSION: ${{ matrix.sst.version }}
      FUSE_SST_VERSION_POLICY: major_minor_patch

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            fuse/requirements.txt
            fuse/requirements-dev.txt

      - name: Install Qt runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Collect ${{ matrix.plugin.name }} deterministic plugin tests
        run: |
          python -m pytest --collect-only -q "${{ matrix.plugin.path }}" -m "${{ matrix.plugin.markers }}"

      - name: Run ${{ matrix.plugin.name }} deterministic plugin tests
        run: |
          python -m pytest -q "${{ matrix.plugin.path }}" -m "${{ matrix.plugin.markers }}"

  sst-external-fixture-tests:
    name: Tier 3 / SST external fixture tests
    needs: plugin-deterministic-tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash
        working-directory: fuse

    env:
      PYTHONPATH: ${{ github.workspace }}/fuse
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"
      SST_EXTERNAL_FIXTURE_MARKERS: sst_external and not sst_live and not sst_remote and not sst_ext and not slow

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            fuse/requirements.txt
            fuse/requirements-dev.txt

      - name: Install Qt runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Collect deterministic SST external fixture tests
        run: |
          python -m pytest --collect-only -q plugins/community/sst/tests -m "$SST_EXTERNAL_FIXTURE_MARKERS"

      - name: Run deterministic SST external fixture tests
        run: |
          python -m pytest -q plugins/community/sst/tests -m "$SST_EXTERNAL_FIXTURE_MARKERS"
