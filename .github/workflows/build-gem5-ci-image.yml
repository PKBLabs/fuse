name: Build gem5 CI Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag suffix, e.g. gem5-v25.1.0.1"
        required: true
        default: "gem5-v25.1.0.1"
      gem5_ref:
        description: "gem5 git tag/ref"
        required: true
        default: "v25.1.0.1"
      gem5_build_isa:
        description: "gem5 build ISA target"
        required: true
        default: "X86"
      make_jobs:
        description: "Parallel SCons jobs used while building gem5"
        required: true
        default: "2"

permissions:
  contents: read
  packages: write

jobs:
  build-gem5-image:
    name: Build and push gem5 CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 420

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "GEM5_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fuse-gem5-ci" >> "$GITHUB_ENV"

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/PyPy || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/node || true
          docker system prune -af || true
          df -h

      - name: Build gem5 CI image
        run: |
          docker build \
            --build-arg GEM5_REF=${{ github.event.inputs.gem5_ref }} \
            --build-arg GEM5_BUILD_ISA=${{ github.event.inputs.gem5_build_isa }} \
            --build-arg GEM5_BUILD_JOBS=${{ github.event.inputs.make_jobs }} \
            -f docker/gem5-ci/Dockerfile \
            -t "$GEM5_IMAGE:${{ github.event.inputs.image_tag }}" \
            -t "$GEM5_IMAGE:latest" \
            .

      - name: Show built image size
        run: |
          docker image ls "$GEM5_IMAGE"

      - name: Push gem5 CI image
        run: |
          docker push "$GEM5_IMAGE:${{ github.event.inputs.image_tag }}"
          docker push "$GEM5_IMAGE:latest"