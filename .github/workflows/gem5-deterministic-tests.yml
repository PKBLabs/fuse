name: Tier 2 / gem5 Deterministic Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Tier 1 / Core Tests
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  gem5-deterministic-tests:
    name: Tier 2 / gem5 deterministic plugin tests
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    defaults:
      run:
        shell: bash

    env:
      PYTHONPATH: ${{ github.workspace }}
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"
      GEM5_PLUGIN_MARKERS: not gem5_live and not slow

    steps:
      - name: Check out repository from completed core run
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check out repository for manual run
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            fuse/requirements.txt
            fuse/requirements-dev.txt

      - name: Install Qt runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fuse/requirements-dev.txt

      - name: Collect deterministic gem5 plugin tests
        run: |
          python -m pytest --collect-only -q fuse/plugins/community/gem5/tests -m "$GEM5_PLUGIN_MARKERS"

      - name: Run deterministic gem5 plugin tests
        run: |
          python -m pytest -q fuse/plugins/community/gem5/tests -m "$GEM5_PLUGIN_MARKERS"
