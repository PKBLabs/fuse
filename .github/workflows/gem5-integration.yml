name: gem5 Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches:
      - main
      - develop
    paths:
      - "fuse/plugins/community/gem5/**"
      - "fuse/core/plugin_runtime/**"
      - "fuse/core/toolchains/**"
      - "fuse/plugin_api/**"
      - "fuse/requirements*.txt"
      - ".github/workflows/gem5-integration.yml"
      - "docker/gem5-ci/**"

permissions:
  contents: read
  packages: read

jobs:
  gem5-live:
    name: gem5 ${{ matrix.gem5.version }} live integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        gem5:
          - version: "25.1.0.1"
            image: "ghcr.io/pkblabs/fuse-gem5-ci:gem5-v25.1.0.1"
          - version: "24.1.0.3"
            image: "ghcr.io/pkblabs/fuse-gem5-ci:gem5-v24.1.0.3"

    container:
      image: ${{ matrix.gem5.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: fuse

    env:
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"
      FUSE_GEM5_VERSION: ${{ matrix.gem5.version }}
      GEM5_ROOT: /opt/gem5
      GEM5_BINARY: /opt/gem5/build/X86/gem5.opt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify gem5 installation
        run: |
          echo "$GEM5_ROOT"
          echo "$GEM5_BINARY"
          test -x "$GEM5_BINARY"
          ldd "$GEM5_BINARY" | tee /tmp/gem5-ldd.txt
          if grep -q "not found" /tmp/gem5-ldd.txt; then
            echo "Missing gem5 runtime shared libraries:"
            grep "not found" /tmp/gem5-ldd.txt
            exit 1
          fi
          "$GEM5_BINARY" --help > /tmp/gem5-help.txt 2>&1
          head -40 /tmp/gem5-help.txt

      - name: Create Python virtual environment
        run: |
          rm -rf /tmp/fuse-venv
          python3 -m venv /tmp/fuse-venv
          /tmp/fuse-venv/bin/python -m pip install --upgrade pip
          /tmp/fuse-venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run live gem5 tests
        run: |
          /tmp/fuse-venv/bin/python -m pytest -q -m "gem5_live"