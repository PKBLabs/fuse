name: gem5 Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches:
      - main
    paths:
      - "fuse/plugins/community/gem5/**"
      - "fuse/core/plugin_runtime/**"
      - "fuse/plugin_api/**"
      - "fuse/requirements*.txt"
      - ".github/workflows/gem5-integration.yml"
      - "docker/gem5-ci/**"

permissions:
  contents: read
  packages: read

jobs:
  gem5-live:
    name: gem5 live integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    container:
      image: ghcr.io/${{ github.repository_owner }}/fuse-gem5-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: fuse

    env:
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"
      GEM5_ROOT: /opt/gem5
      GEM5_BINARY: /opt/gem5/build/X86/gem5.opt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify gem5 installation
        run: |
          echo "$GEM5_ROOT"
          echo "$GEM5_BINARY"
          "$GEM5_BINARY" --version

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run live gem5 tests
        run: |
          .venv/bin/python -m pytest -q -m "gem5_live"