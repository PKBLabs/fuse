name: CLA Check

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  cla-acknowledgement:
    name: CLA acknowledgement
    runs-on: ubuntu-24.04

    steps:
      - name: Check PR body for required CLA acknowledgements
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const required = [
              {
                label: "CLA acknowledgement",
                pattern: /\[x\]\s*I acknowledge the FUSE Contributor License Agreement requirement described in `CLA\.md`/i
              },
              {
                label: "right to submit contribution",
                pattern: /\[x\]\s*I have the right to submit this contribution\./i
              },
              {
                label: "open-source and commercial use acknowledgement",
                pattern: /\[x\]\s*My contribution may be used in open-source and commercial versions of FUSE\./i
              }
            ];

            const missing = required
              .filter((item) => !item.pattern.test(body))
              .map((item) => `- ${item.label}`);

            if (missing.length > 0) {
              core.setFailed(
                [
                  "Missing required CLA/contribution acknowledgements in the PR description:",
                  "",
                  ...missing,
                  "",
                  "Please edit the PR description and check the required boxes."
                ].join("\n")
              );
            }