name: Build SST CI Image

on:
  workflow_dispatch:
    inputs:
      sst_version:
        description: "SST version"
        required: true
        default: "15.0.0"

permissions:
  contents: read
  packages: write

jobs:
  build-sst-image:
    name: Build and push SST CI image
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SST CI image
        run: |
          docker build \
            --build-arg SST_VERSION=${{ github.event.inputs.sst_version }} \
            -f docker/sst-ci/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/fuse-sst-ci:sst-${{ github.event.inputs.sst_version }} \
            -t ghcr.io/${{ github.repository_owner }}/fuse-sst-ci:latest \
            .

      - name: Push SST CI image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/fuse-sst-ci:sst-${{ github.event.inputs.sst_version }}
          docker push ghcr.io/${{ github.repository_owner }}/fuse-sst-ci:latest