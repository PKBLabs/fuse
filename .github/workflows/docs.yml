name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "Doxyfile"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  push:
    branches: [develop, main, stable-release-prep]
    paths:
      - "docs/**"
      - "Doxyfile"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  docs:
    name: Build MkDocs and generated API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Check internal Markdown links
        run: python docs/scripts/check_internal_links.py

      - name: Build generated Doxygen API reference
        run: doxygen Doxyfile

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload MkDocs site
        uses: actions/upload-artifact@v4
        with:
          name: fuse-mkdocs-site
          path: site

      - name: Upload generated Doxygen HTML
        uses: actions/upload-artifact@v4
        with:
          name: fuse-doxygen-html
          path: docs/generated/html
