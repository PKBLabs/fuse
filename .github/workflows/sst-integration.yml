name: SST Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches:
      - main
      - develop
    paths:
      - "fuse/plugins/community/sst/**"
      - "fuse/core/persistence/**"
      - "fuse/core/plugin_runtime/**"
      - "fuse/plugin_api/**"
      - "fuse/requirements*.txt"
      - ".github/workflows/sst-integration.yml"
      - "docker/sst-ci/**"

permissions:
  contents: read
  packages: read

jobs:
  sst-live:
    name: SST ${{ matrix.sst.version }} live integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        sst:
          - version: "15.1.2"
            image: "ghcr.io/pkblabs/fuse-sst-ci:sst-15.1.2"
          - version: "16.0.0"
            image: "ghcr.io/pkblabs/fuse-sst-ci:sst-16.0.0"

    container:
      image: ${{ matrix.sst.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: fuse

    env:
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"
      FUSE_SST_VERSION: ${{ matrix.sst.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify SST installation
        run: |
          which sst
          which sst-info
          sst --version || true
          sst-info --version || true
          sst-info | head -100

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run live SST tests
        run: |
          .venv/bin/python -m pytest -q -m "sst_live"