name: SST Live Integration Tests

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  sst-live:
    name: SST ${{ matrix.sst.version }} live integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        sst:
          - version: "15.1.2"
            image: "ghcr.io/pkblabs/fuse-sst-ci:sst-15.1.2"
          - version: "16.0.0"
            image: "ghcr.io/pkblabs/fuse-sst-ci:sst-16.0.0"

    container:
      image: ${{ matrix.sst.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: fuse

    env:
      PYTHONPATH: ${{ github.workspace }}/fuse
      QT_QPA_PLATFORM: offscreen
      FUSE_SPLASH_MS: "0"
      FUSE_TEST_AUTOCLOSE_MS: "100"
      FUSE_SST_VERSION: ${{ matrix.sst.version }}
      FUSE_SST_VERSION_POLICY: major_minor_patch

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify SST installation
        run: |
          which sst
          which sst-info
          sst --version || true
          sst-info --version || true
          sst-info > /tmp/sst-info.txt
          head -100 /tmp/sst-info.txt

      - name: Create Python virtual environment
        run: |
          rm -rf /tmp/fuse-venv
          python3 -m venv /tmp/fuse-venv
          /tmp/fuse-venv/bin/python -m pip install --upgrade pip
          /tmp/fuse-venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run live SST tests
        run: |
          /tmp/fuse-venv/bin/python -m pytest -q -m "sst_live"